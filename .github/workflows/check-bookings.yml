name: Check TourDash Bookings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs overlap -- a second run waits for the first to finish.
concurrency:
  group: check-bookings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run booking check
        env:
          TOURDASH_API_KEY: ${{ secrets.TOURDASH_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_MELBOURNE: ${{ vars.NOTIFY_EMAIL_MELBOURNE }}
        run: python check_bookings.py

      - name: Commit updated state
        run: |
          git config user.name "tourdash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update last checked timestamp"
          # If the repo changed while we were running, pull those changes
          # in (keeping our state.json) and retry the push.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
